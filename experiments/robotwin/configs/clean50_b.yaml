# B 臂:官方架构(ANN 交互 + DINOv3 ViT-L 视觉)仅把文本换成 sootspike,冻结。
# 相对官方 clean50.yaml 的差异只有 framework.text 与 initialization.load_bert;
# 其余(训练超参、数据、动作头、视觉、交互)与官方逐字一致(PLAN_CN.md §3/§4-C1∥B)。
#
# §5.2 防覆盖:B 必须 load_bert: false——官方 ckpt 里带普通 BERT 权重(TURBOVLA_INIT_CKPT
# 的 bert.* 键),若置 true 会静默覆盖 sootspike 的脉冲权重。训练启动后须核对
# [TurboVLA] loaded N initialization tensors 这行日志,确认文本主干未被加载
# (见 experiments/robotwin/ARMS_CN.md 的 B 臂检查清单)。
run_id: turbovla_robotwin_clean50_b
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: turbovla_robotwin
is_debug: false
version_id: "0.1"

framework:
  name: TurboVLA
  text:
    encoder_type: smoothspike_bert
    mask_version: corrected        # B/A = corrected;C1 保持 legacy(§10-8 已拍板)
    timesteps: 4                   # 融合 ckpt 固定 T=4,不可改
    bert_path: ${oc.env:SMOOTHSPIKE_MODEL_PATH}
    max_text_len: 256
    sub_sentence_present: true
    local_files_only: true
    freeze_text_encoder: true
    attn_implementation: eager     # SmoothSpike 强制 eager(configuration.py 校验)
  vision:
    model_path: ${oc.env:DINOV3_MODEL_PATH}
    image_size: 224
    num_views: 3
    local_files_only: true
    freeze_vision_encoder: false
    attn_implementation: flash_attention_2
    position_init_std: 0.01
    position_scale_init: 0.01
    dropout: 0.1
  interaction:
    hidden_dim: 256
    nheads: 8
    dim_feedforward: 2048
    enhancer_inner_dim: 1024
    num_layers: 6
    text_dropout: 0.0
    fusion_dropout: 0.0
    fusion_droppath: 0.1
    padding_strategy: zero_fill
    residual_style: pre_norm
    attention_backend: sdpa
    compute_precision: bf16_autocast
  initialization:
    pretrained_ckpt: ${oc.env:TURBOVLA_INIT_CKPT}
    load_pretrained: true
    load_bert: false                # §5.2:防官方普通 BERT 覆盖 sootspike
    load_text_projection: true
    load_interaction: true
  action:
    action_dim: 14
    state_dim: 14
    horizon: 50
    num_layers: 3
    dropout: 0.1
    num_state_tokens: 2
    state_hidden_dim: 256
    mlp_hidden_dim: 512
    loss_type: l1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: ${oc.env:ROBOTWIN_DATA_ROOT}
    data_mix: robotwin_clean_50
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 48
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true

trainer:
  use_deepspeed: true
  max_train_steps: 100000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 5.0e-05
    text_encoder: 5.0e-05
    vision_encoder: 5.0e-05
    vision_language_interaction: 5.0e-05
    vision_projection: 5.0e-05
    action_head: 5.0e-05
  lr_scheduler_type: warmup_constant_with_factor
  scheduler_specific_kwargs:
    warmup_start_factor: 0.0
  freeze_modules: text_encoder.bert
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-10
  save_format: pt
  ema_decay: 0.999
  ema_device: cuda
  logging_frequency: 50
